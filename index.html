<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không thể truy cập vào tim cô ấy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #f7f7f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #5f6368;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10%;
        }

        /* Container chính của trang lỗi Chrome */
        .main-frame {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        /* Icon báo lỗi kiểu Chrome Crash / Pixel Paper */
        .icon-wrapper {
            width: 72px;
            height: 72px;
            margin-bottom: 32px;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s ease;
        }

        .icon-wrapper:active {
            transform: scale(0.95);
        }

        /* Tiêu đề lỗi chính */
        h1 {
            color: #202124;
            font-size: 24px;
            font-weight: 500;
            line-height: 1.33;
            margin-bottom: 16px;
            letter-spacing: -0.2px;
        }

        /* Phụ đề */
        .subtitle {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
            color: #5f6368;
        }

        /* Danh sách gợi ý */
        .suggestions {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .suggestions p {
            margin-bottom: 8px;
            color: #5f6368;
        }

        .suggestions ul {
            padding-left: 20px;
            list-style-type: disc;
        }

        .suggestions li {
            margin-bottom: 6px;
            color: #5f6368;
        }

        /* Mã lỗi */
        .error-code {
            font-size: 12px;
            color: #5f6368;
            text-transform: uppercase;
            font-family: monospace, sans-serif;
            letter-spacing: 0.5px;
            margin-bottom: 36px;
        }

        /* Container nút bấm */
        .action-container {
            display: flex;
            justify-content: flex-start;
        }

        /* Nút bấm chuẩn Chrome */
        .btn-action {
            background-color: #1a73e8;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
            outline: none;
        }

        .btn-action:hover {
            background-color: #1557b0;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
        }

        .btn-action:active {
            background-color: #174ea6;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }

        /* Canvas game Khủng long ẩn */
        #game-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 150px;
            z-index: 5;
        }

        #dino-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .game-active #error-details {
            display: none;
        }

        .game-active #game-container {
            display: block;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 0 24px;
            }
            
            h1 {
                font-size: 20px;
            }

            .subtitle, .suggestions {
                font-size: 14px;
            }
        }

        /* Modal xoa dịu khi click "Từ bỏ?" */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            padding: 24px 32px;
            border-radius: 8px;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
            text-align: center;
            transform: translateY(10px);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-card h3 {
            color: #202124;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .modal-card p {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-card button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="main-frame" id="main-frame">
        
        <!-- Khu vực Game Canvas khi kích hoạt Dino -->
        <div id="game-container">
            <canvas id="dino-canvas" width="600" height="150"></canvas>
        </div>

        <!-- Chi tiết thông báo lỗi -->
        <div id="error-details">
            <!-- Icon Crash chuẩn Chrome Pixel/Vector -->
            <div class="icon-wrapper" id="icon-btn" title="Nhấn phím Space hoặc click vào đây để chơi game nhảy!">
                <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M18 12H46L58 24V60H18V12ZM22 16V56H54V26H42V14H22ZM46 16.83L51.17 22H46V16.83Z" fill="#5F6368"/>
                    <!-- Mắt x x -->
                    <path d="M28 28L34 34M34 28L28 34" stroke="#5F6368" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M42 28L48 34M48 28L42 34" stroke="#5F6368" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Miệng buồn -->
                    <path d="M30 46C34 42 42 42 46 46" stroke="#5F6368" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- Tiêu đề chính -->
            <h1>Không thể truy cập vào tim cô ấy</h1>

            <!-- Phụ đề -->
            <p class="subtitle">Kết nối tới cô ấy đã bị mất tín hiệu</p>

            <!-- Gợi ý xử lý -->
            <div class="suggestions">
                <p>Hãy thử:</p>
                <ul>
                    <li>Yêu người khác</li>
                    <li>Quên cô ấy</li>
                    <li>Kiểm tra lại đường truyền</li>
                </ul>
            </div>

            <!-- Mã lỗi -->
            <div class="error-code">ERR_FIND_NO_LOVE</div>

            <!-- Nút bấm hành động -->
            <div class="action-container">
                <button class="btn-action" id="btn-giveup">Từ bỏ?</button>
            </div>
        </div>

    </div>

    <!-- Modal phản hồi khi click Từ bỏ -->
    <div class="modal-overlay" id="modal">
        <div class="modal-card">
            <h3>Đã chấp nhận từ bỏ 💔</h3>
            <p>Đôi khi buông tay lại là cách tốt nhất để chữa lành. Chúc bạn sớm tìm được kết nối thực sự dành cho mình!</p>
            <button id="modal-close">Đóng lại</button>
        </div>
    </div>

    <script>
        // Xử lý sự kiện Modal nút Từ bỏ
        const btnGiveup = document.getElementById('btn-giveup');
        const modal = document.getElementById('modal');
        const modalClose = document.getElementById('modal-close');

        btnGiveup.addEventListener('click', () => {
            modal.classList.add('active');
        });

        modalClose.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // -------------------------------------------------------------------
        // Mini Game Khủng Long / Trái Tim Nhảy Chướng Ngại Vật 
        // Kích hoạt khi ấn phím Space hoặc Click vào Icon trang lỗi
        // -------------------------------------------------------------------
        const iconBtn = document.getElementById('icon-btn');
        const mainFrame = document.getElementById('main-frame');
        const canvas = document.getElementById('dino-canvas');
        const ctx = canvas.getContext('2d');

        let isGameStarted = false;
        let animationFrameId;

        // Cấu hình game
        const game = {
            gravity: 0.6,
            speed: 5,
            score: 0,
            groundY: 130,
            player: {
                x: 40,
                y: 100,
                width: 24,
                height: 24,
                velocityY: 0,
                isJumping: false
            },
            obstacles: [],
            spawnTimer: 0
        };

        function startMiniGame() {
            if (isGameStarted) return;
            isGameStarted = true;
            mainFrame.classList.add('game-active');
            
            // Resize canvas chuẩn khung chứa
            canvas.width = mainFrame.clientWidth || 600;
            canvas.height = 150;
            game.groundY = 130;

            gameLoop();
        }

        function jump() {
            if (!isGameStarted) {
                startMiniGame();
            }
            if (!game.player.isJumping) {
                game.player.velocityY = -10;
                game.player.isJumping = true;
            }
        }

        // Bắt phím Space & Mũi tên lên để nhảy
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jump();
            }
        });

        // Click icon hoặc chạm màn hình để nhảy
        iconBtn.addEventListener('click', startMiniGame);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        canvas.addEventListener('click', jump);

        // Vòng lặp Game
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Vẽ đường mặt đất
            ctx.beginPath();
            ctx.moveTo(0, game.groundY);
            ctx.lineTo(canvas.width, game.groundY);
            ctx.strokeStyle = '#5f6368';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 2. Cập nhật nhân vật (Hình trái tim tan vỡ đơn giản)
            game.player.velocityY += game.gravity;
            game.player.y += game.player.velocityY;

            if (game.player.y >= game.groundY - game.player.height) {
                game.player.y = game.groundY - game.player.height;
                game.player.velocityY = 0;
                game.player.isJumping = false;
            }

            // Vẽ nhân vật (Icon Pixel dạng khối)
            ctx.fillStyle = '#eb4034';
            ctx.fillRect(game.player.x, game.player.y, game.player.width, game.player.height);
            // Mắt biểu cảm nhân vật
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(game.player.x + 4, game.player.y + 5, 4, 4);
            ctx.fillRect(game.player.x + 14, game.player.y + 5, 4, 4);

            // 3. Sinh và cập nhật chướng ngại vật
            game.spawnTimer++;
            if (game.spawnTimer > 90 + Math.random() * 40) {
                game.obstacles.push({
                    x: canvas.width,
                    y: game.groundY - 28,
                    width: 14,
                    height: 28
                });
                game.spawnTimer = 0;
            }

            for (let i = 0; i < game.obstacles.length; i++) {
                let obs = game.obstacles[i];
                obs.x -= game.speed;

                // Vẽ chướng ngại vật (Hình chóp / Xương rồng)
                ctx.fillStyle = '#5f6368';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // Va chạm
                if (
                    game.player.x < obs.x + obs.width &&
                    game.player.x + game.player.width > obs.x &&
                    game.player.y < obs.y + obs.height &&
                    game.player.y + game.player.height > obs.y
                ) {
                    // Reset game khi đụng
                    game.obstacles = [];
                    game.score = 0;
                    game.speed = 5;
                    break;
                }
            }

            // Lọc chướng ngại vật trôi khỏi màn hình
            game.obstacles = game.obstacles.filter(obs => obs.x + obs.width > 0);

            // Điểm số
            game.score += 0.1;
            if (Math.floor(game.score) % 100 === 0 && game.speed < 10) {
                game.speed += 0.2;
            }

            ctx.fillStyle = '#5f6368';
            ctx.font = '12px monospace';
            ctx.fillText(`HI ${Math.floor(game.score).toString().padStart(5, '0')}`, canvas.width - 80, 20);

            animationFrameId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
